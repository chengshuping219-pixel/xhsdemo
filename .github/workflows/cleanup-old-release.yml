name: Remove superseded generated package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-old-release.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove superseded generated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete demo-2026-09-29 --cleanup-tag -y

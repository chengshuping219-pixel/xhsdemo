name: Upload exact local preview ZIP

on:
  push:
    branches: [main]
    paths:
      - 'scripts/restore-local-zip.mjs'
      - '.github/workflows/local-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify original desktop ZIP
        run: node scripts/restore-local-zip.mjs
      - name: Publish original ZIP as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create local-preview-2026-09-29 \
            "xiaohongshu-local-preview.zip#小红书demo-本地预览.zip" \
            --title "小红书demo · 本地预览原始压缩包" \
            --notes "此附件是从本地预览重新打包的原始 ZIP 文件。SHA-256: 6546170e1677262eed3b528cdee68af6a7cc1657e328cd0f84c8a21137c9d5ee"

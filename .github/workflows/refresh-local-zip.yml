name: Refresh local preview ZIP

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-local-zip.mjs'
      - '.github/workflows/refresh-local-zip.yml'
      - 'patches/corner-fix-tail.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download previous verified local ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: chengshuping219-pixel/xhsdemo
        run: |
          mkdir -p previous
          gh release download local-preview-2026-09-29 \
            --pattern xiaohongshu-local-preview.zip --dir previous
      - name: Apply exact local ZIP correction and verify SHA-256
        run: node scripts/refresh-local-zip.mjs
      - name: Replace release asset with corrected local ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: chengshuping219-pixel/xhsdemo
        run: |
          gh release upload local-preview-2026-09-29 \
            "xiaohongshu-local-preview.zip#小红书demo-本地预览.zip" --clobber
